<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: #2c3e50;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        main {
            flex: 1;
            text-align: center;
            padding: 40px;
        }

        h2, h3, h4 {
            color: #2c3e50;
            margin-top: 10px;
        }

        p {
            color: #555;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2c3e50;
            margin: 20px 0;
        }

        a {
            text-decoration: none;
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
        }

        a:hover {
            background-color: #1a252f;
        }

        table {
            margin: 20px auto;
            width: 80%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<nav>
    Login Berhasil 🎉
</nav>

<main>
    <p>Selamat datang di aplikasi!</p>

    <img src="/salmaa.png" class="profile-img">

    <h2>Salmaa Rifhani Rayyan</h2>
    <p><i>Aku boleh ragu, tapi tetap maju.</i></p>

    <h3>MY Website 20230140082</h3>

    <a href="/form">+ Input Data Mahasiswa</a>

    <h4>Data Mahasiswa</h4>

    <table>
        <thead>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jenis Kelamin</th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${#lists.isEmpty(data)}">
            <td colspan="4">Belum ada data</td>
        </tr>

        <tr th:each="u, i : ${data}">
            <td th:text="${i.index+1}"></td>
            <td th:text="${u.nama}"></td>
            <td th:text="${u.nim}"></td>
            <td th:text="${u.jenisKelamin}"></td>
        </tr>
        </tbody>
    </table>

    <a href="/">Logout</a>
</main>

<footer>
    © 2026 - Website Mahasiswa
</footer>

</body>
</html>
