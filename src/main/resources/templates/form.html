<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color:#f8f9fa;">

<div class="container mt-5">

    <div class="card p-4 shadow">
        <h3 class="mb-3">Form Input Mahasiswa</h3>

        <form action="/save" method="post" th:object="${user}">

            <div class="mb-3">
                <label>Nama</label>
                <input type="text" class="form-control" th:field="*{nama}" placeholder="Masukkan nama">
            </div>

            <div class="mb-3">
                <label>NIM</label>
                <input type="text" class="form-control" th:field="*{nim}" placeholder="Masukkan NIM">
            </div>

            <button type="submit" class="btn btn-success">Submit</button>
            <a href="/home" class="btn btn-secondary">Kembali</a>

        </form>

    </div>

</div>

</body>
</html>
